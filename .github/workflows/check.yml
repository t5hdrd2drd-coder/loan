name: Verify ledger
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-previews
          path: artifacts/
